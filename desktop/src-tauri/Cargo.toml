[package]
name = "xml-wizard"
version = "0.3.0"
description = "Map and design REDCap surveys and their branching logic, offline"
authors = ["David Pletta"]
license = "MIT"
edition = "2021"

[lib]
name = "xml_wizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
