<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XML Wizard Designer</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #d9d6cc; --soft: #efede6;
  --card: #ffffff; --card-line: #cfcbbf; --accent: #2f5d8a; --accent-ink: #ffffff; --accent-soft: #e6eef7;
  --gate: #b06a00; --gate-bg: #fff3df; --err: #b42318; --err-bg: #fde8e6; --warn: #9a6700; --warn-bg: #fff6d6;
  --ok: #2e7d4f; --ok-bg: #e3f3e9; --ins: #23395b; --ins-ink: #ffffff; --child: #8a3fa0; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #a3a199; --line: #34332f; --soft: #2a2925;
    --card: #23231f; --card-line: #45443e; --accent: #7fb0e0; --accent-ink: #10202f; --accent-soft: #1c2a3a;
    --gate: #f0a540; --gate-bg: #3a2c14; --err: #ff8a80; --err-bg: #3d1d1a; --warn: #f2c94c; --warn-bg: #3a3115;
    --ok: #6fcf97; --ok-bg: #173224; --ins: #3a5a85; --ins-ink: #ffffff; --child: #d39ce6; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { font-size: 13px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.quiet { border-color: transparent; background: transparent; }
button.quiet:hover:not(:disabled) { background: var(--soft); border-color: transparent; }
button.danger { color: var(--err); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=number], input[type=date], input[type=email], select, textarea {
  width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
textarea { resize: vertical; min-height: 56px; }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* Top bar */
#top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; height: 52px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--ins); color: var(--ins-ink); display: grid; place-items: center; font-size: 13px; }
.brand .sub { font-weight: 400; color: var(--muted); }
#title { flex: 1 1 160px; max-width: 420px; font-weight: 600; border-color: transparent; background: transparent; text-overflow: ellipsis; }
#title:hover, #title:focus { border-color: var(--line); background: var(--bg); }
.spacer { flex: 1; }
.pill { border-radius: 999px; padding: 4px 11px; font-size: 12px; }
.pill.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
.pill.err { color: var(--err); background: var(--err-bg); border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }

main { display: flex; height: calc(100% - 52px); min-height: 0; }

/* Palette */
#palette { width: 196px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 10px 24px; }
#palette h2, #inspector h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 4px 6px; font-weight: 600; }
#palette h2:first-child { margin-top: 0; }
.tile { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; margin: 3px 0; text-align: left; border: 1px solid var(--line);
  border-radius: 9px; background: var(--card); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.tile:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.tile small { display: none; color: var(--muted); font-size: 11px; line-height: 1.2; white-space: normal; }
@media (min-height: 1040px) { .tile small { display: block; } }
.glyph { flex: none; width: 28px; height: 24px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
  font-size: 11px; font-weight: 700; letter-spacing: -.02em; }
.palette-tip { color: var(--muted); font-size: 12px; margin: 14px 4px 0; }

/* Canvas */
#stage { flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab; min-width: 0;
  background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; align-items: flex-start; gap: 28px; padding: 4px; width: max-content; }
.form { width: 316px; flex: none; background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.form.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.form-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 12px; background: var(--ins); color: var(--ins-ink); border-radius: 13px 13px 0 0; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
.form-head .name { flex: 1; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form-head .count { font-size: 11px; opacity: .8; }
.form-body { position: relative; padding: 10px 10px 4px; min-height: 40px; }
.form-foot { padding: 4px 10px 10px; }
.form-foot button { width: 100%; border-style: dashed; color: var(--muted); background: transparent; }
.form-add { width: 200px; flex: none; min-height: 90px; border: 2px dashed var(--line); border-radius: 14px; background: transparent; color: var(--muted); font-size: 14px; white-space: normal; }
.form-add.drop-hot, .form-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--card-line); stroke-width: 1.5; }
.wires path.hot { stroke: var(--accent); stroke-width: 2.2; }

.card { position: relative; background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 7px 9px 8px; margin: 0 0 8px;
  cursor: pointer; user-select: none; -webkit-user-select: none; }
.card:hover { border-color: var(--accent); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card.ctl { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent); }
.card.dep { box-shadow: 0 0 0 2px color-mix(in srgb, var(--child) 30%, transparent); border-color: var(--child); }
.card.dragging { opacity: .3; }
.card.link-target { box-shadow: 0 0 0 3px var(--gate); border-color: var(--gate); }
.card.flash { animation: flash 1s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 6px var(--gate); } to { box-shadow: 0 0 0 2px var(--accent); } }
.card-top { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.card-top .glyph { width: 24px; height: 20px; font-size: 10px; }
.card-top .kind { font-size: 11px; color: var(--muted); white-space: nowrap; }
.card-top .var { margin-left: auto; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.badge { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 5px; line-height: 16px; }
.badge.req { color: var(--err); background: var(--err-bg); }
.badge.rid { color: var(--accent); background: var(--accent-soft); }
.badge.issue-error { color: var(--err); background: var(--err-bg); }
.badge.issue-warning { color: var(--warn); background: var(--warn-bg); }
.grip { flex: none; width: 14px; height: 20px; cursor: grab; touch-action: none; opacity: .45;
  background-image: radial-gradient(currentColor 1.2px, transparent 1.3px); background-size: 6px 6px; background-position: 1px 1px; }
.card-label { margin: 4px 0 0; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.card-label.empty { color: var(--muted); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); cursor: crosshair; touch-action: none;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--gate); background: var(--gate-bg); color: var(--gate); }
.chip.more { cursor: default; border-style: dashed; background: transparent; color: var(--muted); }
.gate { margin-top: 6px; font-size: 12px; background: var(--gate-bg); border-left: 3px solid var(--gate); border-radius: 4px; padding: 3px 7px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.gate b { color: var(--gate); font-weight: 650; }
.branch { position: absolute; right: -11px; top: 50%; margin-top: -11px; width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 12px; line-height: 1;
  color: var(--gate); border-color: var(--gate); background: var(--gate-bg); cursor: crosshair; touch-action: none; display: none; }
.card:hover .branch, .card.selected .branch { display: block; }
.card.section { background: transparent; border: none; border-bottom: 2px solid var(--ins); border-radius: 0; padding: 8px 2px 3px; display: flex; gap: 6px; align-items: center; }
.card.section .card-label { margin: 0; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; -webkit-line-clamp: 2; }
.card.section.selected { box-shadow: none; background: var(--accent-soft); }
.drop-slot { height: 4px; margin: -2px 0; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); position: relative; z-index: 2; }
.form-slot { width: 4px; align-self: stretch; margin: 0 -16px; border-radius: 2px; background: var(--accent); min-height: 80px; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .92; transform-origin: 0 0; box-shadow: 0 8px 28px rgba(0,0,0,.25); margin: 0; }
.drag-ghost.tile { width: 180px; }
#linkLayer { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; }
#linkLayer path { fill: none; stroke: var(--gate); stroke-width: 2.5; stroke-dasharray: 6 5; }
#linkLayer circle { fill: var(--gate); }

#zoom { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); cursor: default; }
#zoom button { border: none; padding: 4px 9px; }
#zoom span { font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
#canvas-hint[hidden] { display: none; }
#canvas-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  font-size: 12px; color: var(--muted); box-shadow: var(--shadow); white-space: nowrap; max-width: calc(100% - 200px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
#fab { display: none; position: absolute; right: 14px; bottom: 14px; width: 54px; height: 54px; border-radius: 50%; font-size: 26px; padding: 0; box-shadow: var(--shadow); }

/* Inspector */
#inspector { width: 348px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px 60px; }
#inspector h2 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
#inspector h3 { margin: 18px 0 6px; }
#inspector .lead { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.sheet-close { display: none; margin-left: auto; }
label.f { display: block; margin: 10px 0 0; font-size: 12px; color: var(--muted); }
label.f > input, label.f > select, label.f > textarea { margin-top: 3px; color: var(--ink); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; font-size: 13px; cursor: pointer; }
.check input { margin-top: 3px; }
.check small { display: block; color: var(--muted); }
.choice-row { display: grid; grid-template-columns: 58px 1fr 28px; gap: 5px; margin: 4px 0; }
.choice-row input:first-child { font-family: var(--mono); font-size: 12px; text-align: center; padding: 6px 4px; }
.icon-btn { padding: 0; width: 28px; height: 32px; border-color: transparent; background: transparent; color: var(--muted); font-size: 15px; }
.icon-btn:hover:not(:disabled) { color: var(--err); background: var(--err-bg); border-color: transparent; }
.link-btn { border: none; background: none; padding: 2px 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; border: none; border-radius: 0; background: transparent; padding: 6px 8px; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.rules { background: var(--gate-bg); border-left: 3px solid var(--gate); border-radius: 6px; padding: 8px 8px 6px; margin-top: 8px; }
.rule { display: grid; grid-template-columns: 1fr 28px; gap: 4px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed color-mix(in srgb, var(--gate) 40%, transparent); }
.rule .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.rule .parts select:first-child { grid-column: 1 / -1; }
.rule .parts .solo { grid-column: 1 / -1; }
.rules .english { font-size: 12.5px; margin: 2px 0 6px; }
.note { font-size: 12.5px; border-radius: 8px; padding: 7px 10px; margin: 6px 0; }
.note.error { background: var(--err-bg); } .note.warning { background: var(--warn-bg); } .note.info { background: var(--accent-soft); }
.note.click { cursor: pointer; }
.note b { font-weight: 650; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 6px 0; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; }
details.adv { margin-top: 16px; } details.adv summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.steps { margin: 6px 0 0; padding-left: 20px; } .steps li { margin: 3px 0; }

/* Modals, menus, toasts */
.scrim { position: fixed; inset: 0; background: rgba(15,15,12,.45); z-index: 100; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border-radius: 16px; max-width: 760px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 22px 24px; }
.modal.wide { max-width: 880px; }
.modal h2 { margin: 0 0 4px; font-size: 20px; }
.modal .lead { color: var(--muted); margin: 0 0 16px; }
.modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.modal-head h2 { flex: 1; margin: 0; min-width: 140px; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.option { text-align: left; white-space: normal; padding: 16px; border-radius: 14px; background: var(--card); display: flex; flex-direction: column; gap: 6px; height: 100%; }
.option:hover { box-shadow: var(--shadow); }
.option .big { font-size: 26px; line-height: 1; }
.option strong { font-size: 15px; }
.option span { color: var(--muted); font-size: 13px; }
.panelbox { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.panelbox h3 { margin: 0 0 2px; font-size: 15px; }
.panelbox p { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
.menu { position: fixed; z-index: 90; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; min-width: 200px; max-height: 70vh; overflow: auto; }
.menu button { display: flex; gap: 9px; align-items: center; width: 100%; text-align: left; border: none; border-radius: 8px; background: transparent; padding: 7px 10px; }
.menu button:hover { background: var(--soft); }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
#toast { position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); z-index: 120; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px;
  font-size: 13px; max-width: min(560px, calc(100vw - 24px)); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
.dropzone { position: fixed; inset: 0; z-index: 130; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 4px dashed var(--accent); display: none; place-items: center; font-size: 22px; font-weight: 700; color: var(--accent); pointer-events: none; }
.dropzone.show { display: grid; }

/* Preview */
.pv-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 14px; }
.pv-bar select { width: auto; flex: 1 1 160px; }
.pv-form { border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px 18px; background: var(--card); }
.pv-section { margin: 20px -18px 0; padding: 7px 18px; background: var(--soft); font-weight: 700; }
.pv-q { padding: 14px 0 0; }
.pv-q.skipped { display: none; }
.show-skipped .pv-q.skipped { display: block; opacity: .45; }
.pv-q .q { font-weight: 600; margin-bottom: 6px; }
.pv-q .q .star { color: var(--err); }
.pv-q .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pv-q label.opt { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; font-weight: 400; }
.pv-q input[type=text], .pv-q input[type=number], .pv-q input[type=date], .pv-q input[type=email], .pv-q select, .pv-q textarea { max-width: 420px; }
.pv-tag { display: inline-block; font-size: 11px; border-radius: 999px; padding: 0 8px; margin-left: 6px; font-weight: 600; vertical-align: middle; }
.pv-tag.skip { background: var(--soft); color: var(--muted); } .pv-tag.unk { background: var(--warn-bg); color: var(--warn); } .pv-tag.cond { background: var(--gate-bg); color: var(--gate); }
.pv-desc { padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; }

@media (max-width: 1080px) { #inspector { width: 300px; } #palette { width: 168px; } .tile small { display: none; } }
@media (max-width: 820px) {
  #palette { display: none; position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 62vh; z-index: 80; border: none; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25); padding-bottom: 28px; }
  #palette.open { display: block; }
  #palette .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  #fab { display: block; }
  #inspector { display: none; position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 68vh; z-index: 70; border: none; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25); }
  #inspector.open { display: block; }
  .sheet-close { display: inline-block; }
  #canvas-hint, .brand .sub, .brand .word, #undo, #redo { display: none; }
  #top { gap: 5px; padding: 8px; }
  #top button { padding: 6px 8px; }
  #zoom { bottom: 14px; }
  #toast { bottom: auto; top: 62px; }
}

</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo">W</span><span class="word">XML Wizard</span><span class="sub">Designer</span></div>
  <input id="title" type="text" aria-label="Survey title" placeholder="Survey title">
  <span class="spacer"></span>
  <button id="undo" class="quiet" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
  <button id="redo" class="quiet" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
  <button id="problems" class="pill ok" title="Things to fix before uploading to REDCap">✓ No problems</button>
  <button id="preview" title="Answer the survey yourself to test the branching">▶ Preview</button>
  <button id="open" title="Open a REDCap project XML or data dictionary CSV">Open</button>
  <button id="export" class="primary">Export</button>
  <button id="more" class="quiet" aria-label="More">⋯</button>
</header>
<main>
  <aside id="palette" aria-label="Question types"></aside>
  <section id="stage" aria-label="Survey canvas">
    <div id="world"></div>
    <div id="zoom">
      <button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-fit">Fit</button>
    </div>
    <div id="canvas-hint"></div>
    <button id="fab" class="primary" aria-label="Add a question">+</button>
  </section>
  <aside id="inspector" aria-label="Details"></aside>
</main>
<svg id="linkLayer" aria-hidden="true"></svg>
<div id="toast" role="status"></div>
<div id="dropzone" class="dropzone">Drop your REDCap file to open it</div>
<input id="file" type="file" accept=".xml,.csv,text/xml,text/csv" hidden>
<script type="application/json" id="xmlw-preload">null</script>
<script>
/* XML Wizard designer core: survey model, REDCap import/export, branching logic.
 *
